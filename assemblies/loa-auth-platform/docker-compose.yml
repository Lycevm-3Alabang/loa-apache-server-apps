name: loa-auth

services:
  auth-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: loa-auth-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: loa_auth
      DB_USERNAME: loa
      DB_PASSWORD: loa-secret
      SEQ_URL: "http://seq:5341"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loa

  seq:
    image: datalust/seq
    restart: unless-stopped
    ports:
      # Seq 2026.1: :5341 is ingestion-only; the UI + API live on :80.
      # Map host 5341 -> container 80 so http://localhost:5341 serves the UI,
      # while apps still ship logs to seq:5341 (container ingestion listener).
      - "5341:80"
    volumes:
      - seq_data:/data
    environment:
      - ACCEPT_EULA=Y
      - BASE_URI=http://localhost:5341
    networks:
      - loa

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-app
    networks:
      - loa

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: loa_auth
      MYSQL_USER: loa
      MYSQL_PASSWORD: loa-secret
      MYSQL_ROOT_PASSWORD: root-secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - loa

  scheduler:
    image: loa-auth-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: loa_auth
      DB_USERNAME: loa
      DB_PASSWORD: loa-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loa

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - loa

volumes:
  mysql_data:
  seq_data:

networks:
  loa:
