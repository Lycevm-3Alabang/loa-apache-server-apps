name: loa-cert

services:
  cert-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: loa-cert-app
    restart: unless-stopped
    working_dir: /var/www/html/cert-app
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: loa_cert
      DB_USERNAME: loa
      DB_PASSWORD: loa-secret
      JWT_SECRET: dev-only-secret-change-before-production
      JWT_ACCESS_TTL: 15
      JWT_REFRESH_TTL: 10080
      L5_SWAGGER_OPEN_API_SPEC_VERSION: 3.1.0
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loa

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "9001:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cert-app
    networks:
      - loa

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: loa_cert
      MYSQL_USER: loa
      MYSQL_PASSWORD: loa-secret
      MYSQL_ROOT_PASSWORD: root-secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - loa

  scheduler:
    image: loa-cert-app
    restart: unless-stopped
    working_dir: /var/www/html/cert-app
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: loa_cert
      DB_USERNAME: loa
      DB_PASSWORD: loa-secret
    depends_on:
      cert-app:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - loa

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - loa

volumes:
  mysql_data:

networks:
  loa:
