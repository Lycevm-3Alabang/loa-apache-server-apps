name: loa-platform

services:
  seq:
    image: datalust/seq
    restart: unless-stopped
    ports:
      # Seq 2026.1: :5341 is ingestion-only; the UI + API live on :80.
      # Map host 5341 -> container 80 so http://localhost:5341 serves the UI,
      # while apps still ship logs to seq:5341 (container ingestion listener).
      - "5341:80"
    volumes:
      - seq_data:/data
    environment:
      - ACCEPT_EULA=Y
      - BASE_URI=http://localhost:5341
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    networks:
      - loa

  auth-app:
    build:
      context: ./assemblies/loa-auth-platform
      dockerfile: docker/php/Dockerfile
    image: loa-auth-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./assemblies/loa-auth-platform:/var/www/html
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: loa_auth
      DB_USERNAME: loa
      DB_PASSWORD: loa-secret
      SEQ_URL: "http://seq:5341"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loa

  auth-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./assemblies/loa-auth-platform:/var/www/html
      - ./assemblies/loa-auth-platform/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-app
    networks:
      - loa

  auth-scheduler:
    image: loa-auth-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./assemblies/loa-auth-platform:/var/www/html
    environment:
      APP_ENV: local
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: loa_auth
      DB_USERNAME: loa
      DB_PASSWORD: loa-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loa

  cert-app:
    build:
      context: ./assemblies/loa-cert-platform
      dockerfile: docker/php/Dockerfile
    image: loa-cert-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./assemblies/loa-cert-platform:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: loa_cert
      DB_USERNAME: loa
      DB_PASSWORD: loa-secret
      JWT_SECRET: dev-only-secret-change-before-production
      JWT_ACCESS_TTL: 15
      JWT_REFRESH_TTL: 10080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
      L5_SWAGGER_OPEN_API_SPEC_VERSION: 3.1.0
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_ENCRYPTION: null
      MAIL_FROM_ADDRESS: "noreply@lyceumalabang.edu.ph"
      MAIL_FROM_NAME: "${APP_NAME}"
      SEQ_URL: "http://seq:5341"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loa

  cert-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "9001:80"
    volumes:
      - ./assemblies/loa-cert-platform:/var/www/html
      - ./assemblies/loa-cert-platform/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - cert-app
    networks:
      - loa

  cert-scheduler:
    image: loa-cert-app
    restart: unless-stopped
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./assemblies/loa-cert-platform:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: loa_cert
      DB_USERNAME: loa
      DB_PASSWORD: loa-secret
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - loa

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: loa_auth
      MYSQL_USER: loa
      MYSQL_PASSWORD: loa-secret
      MYSQL_ROOT_PASSWORD: root-secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "33060:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-secret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - loa

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - loa

volumes:
  mysql_data:
  seq_data:

networks:
  loa:
